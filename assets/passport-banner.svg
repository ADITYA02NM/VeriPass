<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#f7d774" />
      <stop offset="50%" style="stop-color:#f5cd79" />
      <stop offset="100%" style="stop-color:#f7d774" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="800" height="200" fill="url(#bg)" rx="12"/>
  
  <!-- Passport Book -->
  <g transform="translate(80, 25)">
    <!-- Book Cover -->
    <rect x="0" y="0" width="120" height="150" rx="8" fill="#1a3a5c" stroke="#f5cd79" stroke-width="2"/>
    <!-- Book Pages -->
    <rect x="5" y="5" width="110" height="140" rx="4" fill="#0d1b2a"/>
    <!-- Passport Emblem -->
    <circle cx="60" cy="55" r="25" fill="none" stroke="#f5cd79" stroke-width="1.5"/>
    <text x="60" y="62" text-anchor="middle" fill="#f5cd79" font-size="28" font-weight="bold">🛂</text>
    <!-- Text Lines -->
    <rect x="25" y="90" width="70" height="4" rx="2" fill="#f5cd79" opacity="0.6"/>
    <rect x="35" y="100" width="50" height="3" rx="1.5" fill="#f5cd79" opacity="0.4"/>
    <rect x="30" y="110" width="60" height="3" rx="1.5" fill="#f5cd79" opacity="0.4"/>
    <!-- QR Code -->
    <rect x="38" y="118" width="24" height="24" fill="#f5cd79" opacity="0.15"/>
    <rect x="40" y="120" width="8" height="8" fill="#f5cd79" opacity="0.4"/>
    <rect x="52" y="120" width="8" height="8" fill="#f5cd79" opacity="0.4"/>
    <rect x="40" y="132" width="20" height="8" fill="#f5cd79" opacity="0.3"/>
  </g>
  
  <!-- Title -->
  <text x="260" y="80" font-family="'Segoe UI', Arial, sans-serif" font-size="52" font-weight="bold" fill="url(#gold)" filter="url(#glow)">VeriPass</text>
  
  <!-- Subtitle -->
  <text x="260" y="115" font-family="'Segoe UI', Arial, sans-serif" font-size="18" fill="#e0e0e0" opacity="0.9">x402 Agentic Product Passport</text>
  <text x="260" y="140" font-family="'Segoe UI', Arial, sans-serif" font-size="16" fill="#a0a0a0">Algorand TestNet · AI Agents · Micropayments</text>
  
  <!-- Algorand Logo -->
  <g transform="translate(700, 50)">
    <circle cx="30" cy="30" r="28" fill="none" stroke="#f5cd79" stroke-width="1.5"/>
    <text x="30" y="38" text-anchor="middle" fill="#f5cd79" font-size="24" font-weight="bold">A</text>
    <text x="30" y="75" text-anchor="middle" fill="#a0a0a0" font-size="10">Algorand</text>
  </g>
  
  <!-- Decorative Elements -->
  <circle cx="240" cy="100" r="3" fill="#f5cd79" opacity="0.5"/>
  <circle cx="250" cy="85" r="2" fill="#f5cd79" opacity="0.3"/>
  <circle cx="245" cy="115" r="2" fill="#f5cd79" opacity="0.4"/>
  
  <!-- Bottom Line -->
  <rect x="260" y="155" width="400" height="1" fill="url(#gold)" opacity="0.3"/>
  <text x="260" y="175" font-family="'Segoe UI', Arial, sans-serif" font-size="12" fill="#808080">Cyber Assassins · Bangalore Institute of Engineering</text>
</svg>