<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="teamBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0f3460"/>
    </linearGradient>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="50" cy="50" r="45" fill="url(#teamBg)" stroke="#f5cd79" stroke-width="2"/>
  
  <!-- Person 1 (Center - Leader) -->
  <circle cx="50" cy="35" r="10" fill="#f5cd79"/>
  <rect x="40" y="48" width="20" height="15" rx="3" fill="#f5cd79"/>
  <text x="50" y="42" text-anchor="middle" fill="#1a1a2e" font-size="8" font-weight="bold">👑</text>
  
  <!-- Person 2 (Left) -->
  <circle cx="25" cy="50" r="8" fill="#4CAF50" opacity="0.9"/>
  <rect x="18" y="60" width="14" height="12" rx="2" fill="#4CAF50" opacity="0.9"/>
  
  <!-- Person 3 (Right) -->
  <circle cx="75" cy="50" r="8" fill="#2196F3" opacity="0.9"/>
  <rect x="68" y="60" width="14" height="12" rx="2" fill="#2196F3" opacity="0.9"/>
  
  <!-- Person 4 (Bottom) -->
  <circle cx="50" cy="72" r="8" fill="#FF9800" opacity="0.9"/>
  <rect x="43" y="82" width="14" height="12" rx="2" fill="#FF9800" opacity="0.9"/>
  
  <!-- Connection Lines -->
  <line x1="50" y1="45" x2="25" y2="50" stroke="#f5cd79" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="45" x2="75" y2="50" stroke="#f5cd79" stroke-width="1" opacity="0.5"/>
  <line x1="50" y1="45" x2="50" y2="72" stroke="#f5cd79" stroke-width="1" opacity="0.5"/>
  
  <!-- Title -->
  <text x="50" y="96" text-anchor="middle" fill="#f5cd79" font-size="8" font-weight="bold">CYBER ASSASSINS</text>
</svg>