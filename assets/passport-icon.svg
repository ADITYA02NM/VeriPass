<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 150">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>
  
  <!-- Circle Background -->
  <circle cx="75" cy="75" r="70" fill="url(#iconBg)" stroke="#f5cd79" stroke-width="2"/>
  
  <!-- Passport Book -->
  <rect x="35" y="25" width="80" height="100" rx="6" fill="#1a3a5c" stroke="#f5cd79" stroke-width="1.5"/>
  <rect x="38" y="28" width="74" height="94" rx="4" fill="#0d1b2a"/>
  
  <!-- Emblem -->
  <circle cx="75" cy="60" r="18" fill="none" stroke="#f5cd79" stroke-width="1.2"/>
  <text x="75" y="68" text-anchor="middle" fill="#f5cd79" font-size="22" font-weight="bold">V</text>
  
  <!-- Lines -->
  <rect x="50" y="85" width="50" height="3" rx="1.5" fill="#f5cd79" opacity="0.5"/>
  <rect x="55" y="92" width="40" height="2" rx="1" fill="#f5cd79" opacity="0.3"/>
  
  <!-- QR Code -->
  <rect x="52" y="98" width="18" height="18" fill="#f5cd79" opacity="0.2"/>
  <rect x="54" y="100" width="6" height="6" fill="#f5cd79" opacity="0.5"/>
  <rect x="62" y="100" width="6" height="6" fill="#f5cd79" opacity="0.5"/>
  <rect x="54" y="108" width="14" height="6" fill="#f5cd79" opacity="0.3"/>
  
  <!-- Checkmark -->
  <circle cx="105" cy="105" r="15" fill="#00C853" opacity="0.9"/>
  <path d="M98 105 L103 110 L112 98" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>